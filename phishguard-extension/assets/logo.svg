<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Drop Shadow Filter for Shield Depth -->
    <filter id="shieldShadow" x="-20%" y="-15%" width="140%" height="145%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#020617" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1E3A8A" flood-opacity="0.4"/>
    </filter>

    <!-- Shield Fill Gradients -->
    <linearGradient id="shieldFillGrad" x1="20" y1="10" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="40%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="shieldBorderGrad" x1="15" y1="10" x2="105" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#2563EB"/>
      <stop offset="85%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Net Mesh Gradient -->
    <linearGradient id="netGrad" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Fish Gradients (Fluid, luminous cyber-marine gradients) -->
    <linearGradient id="fishAlpha" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="fishBeta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="fishGamma" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="60%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Subtle water/security flow glow -->
    <radialGradient id="guardCoreGlow" cx="64" cy="60" r="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner Shield Clip -->
    <clipPath id="shieldInterior">
      <path d="M60 14C80 23 93 25 96 28C97.5 52 90.5 76 60 98C29.5 76 22.5 52 24 28C27 25 40 23 60 14Z"/>
    </clipPath>
  </defs>

  <!-- Shield Outer Group with Shadow -->
  <g filter="url(#shieldShadow)">
    <!-- Outer Shield Rim / Bevel -->
    <path d="M60 8C84 19 99 21 103 25C105 55 97 84 60 110C23 84 15 55 17 25C21 21 36 19 60 8Z" fill="url(#shieldBorderGrad)"/>

    <!-- Shield Inner Cavity -->
    <path d="M60 14C80 23 93 25 96 28C97.5 52 90.5 76 60 98C29.5 76 22.5 52 24 28C27 25 40 23 60 14Z" fill="url(#shieldFillGrad)"/>

    <!-- Subtle inner rim stroke highlight -->
    <path d="M60 14C80 23 93 25 96 28C97.5 52 90.5 76 60 98C29.5 76 22.5 52 24 28C27 25 40 23 60 14Z" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.5"/>
  </g>

  <!-- Interior Content clipped to shield -->
  <g clip-path="url(#shieldInterior)">
    <!-- Ambient Core Glow shifted slightly with fishes -->
    <circle cx="65" cy="58" r="42" fill="url(#guardCoreGlow)"/>

    <!-- Fishnet Grid - Clean, high contrast diagonal grid lines without dots -->
    <g stroke="url(#netGrad)" stroke-width="2.2" stroke-linecap="round">
      <!-- Southwest to Northeast lines -->
      <line x1="12" y1="42" x2="68" y2="-14" />
      <line x1="10" y1="68" x2="84" y2="-6" />
      <line x1="14" y1="92" x2="104" y2="2" />
      <line x1="24" y1="112" x2="114" y2="22" />
      <line x1="42" y1="120" x2="120" y2="42" />
      <line x1="62" y1="124" x2="124" y2="62" />

      <!-- Northwest to Southeast lines -->
      <line x1="108" y1="42" x2="52" y2="-14" />
      <line x1="110" y1="68" x2="36" y2="-6" />
      <line x1="106" y1="92" x2="16" y2="2" />
      <line x1="96" y1="112" x2="6" y2="22" />
      <line x1="78" y1="120" x2="0" y2="42" />
      <line x1="58" y1="124" x2="-4" y2="62" />
    </g>

    <!-- Wake ripples shifted right with the school -->
    <path d="M44 48 Q50 46 56 49" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.4" fill="none"/>
    <path d="M54 64 Q62 61 70 65" stroke="#34D399" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.4" fill="none"/>
    <path d="M42 78 Q48 75 54 78" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.3" fill="none"/>

    <!-- THE THREE FISHES: Shifted right by ~7px for dynamic forward positioning -->

    <!-- 1. Leader Fish (Top/Center-Right, shifted from x:64 to x:71) -->
    <g transform="translate(71, 45) rotate(14)">
      <!-- Fish Body with sleek organic curvature -->
      <path d="M-13 0 C-6.5 -5.8, 6.5 -5.2, 14 0 C6.5 5.2, -6.5 5.8, -13 0 Z" fill="url(#fishBeta)"/>
      <!-- Fin / Fluke Tail with defined split/angle -->
      <path d="M-13 0 L-20 -5.5 C-18 -1.5, -18 1.5, -20 5.5 Z" fill="url(#fishBeta)"/>
      <!-- Tiny dorsal fin hint -->
      <path d="M-3 -4.5 Q1 -7 5 -3.5" fill="none" stroke="#67E8F9" stroke-width="0.8" stroke-linecap="round"/>
      <!-- Eye -->
      <circle cx="9.5" cy="-1.2" r="1.2" fill="#020617"/>
      <circle cx="10" cy="-1.5" r="0.4" fill="#FFFFFF"/>
    </g>

    <!-- 2. Companion Fish (Center/Mid, shifted from x:56 to x:63) -->
    <g transform="translate(63, 59) rotate(-4)">
      <!-- Fish Body -->
      <path d="M-14 0 C-7 -6.2, 7.5 -5.8, 15 0 C7.5 5.8, -7 6.2, -14 0 Z" fill="url(#fishAlpha)"/>
      <!-- Defined Tail Fluke -->
      <path d="M-14 0 L-22 -6 C-20 -1.5, -20 1.5, -22 6 Z" fill="url(#fishAlpha)"/>
      <!-- Tiny dorsal fin hint -->
      <path d="M-4 -4.8 Q1 -7.5 6 -4" fill="none" stroke="#67E8F9" stroke-width="0.9" stroke-linecap="round"/>
      <!-- Eye -->
      <circle cx="10.5" cy="-1.3" r="1.3" fill="#020617"/>
      <circle cx="11" cy="-1.6" r="0.45" fill="#FFFFFF"/>
    </g>

    <!-- 3. Lower Guard Fish (Bottom-Left to Center, shifted from x:48 to x:55) -->
    <g transform="translate(55, 73) rotate(22)">
      <!-- Fish Body -->
      <path d="M-11 0 C-5.5 -4.8, 5.5 -4.5, 12 0 C5.5 4.5, -5.5 4.8, -11 0 Z" fill="url(#fishGamma)"/>
      <!-- Defined Tail Fluke -->
      <path d="M-11 0 L-18 -4.8 C-16.5 -1.2, -16.5 1.2, -18 4.8 Z" fill="url(#fishGamma)"/>
      <!-- Tiny dorsal fin hint -->
      <path d="M-3 -3.8 Q1 -6 5 -3" fill="none" stroke="#34D399" stroke-width="0.8" stroke-linecap="round"/>
      <!-- Eye -->
      <circle cx="8" cy="-1" r="1.0" fill="#020617"/>
    </g>
  </g>
</svg>
